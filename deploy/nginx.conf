server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(repositories|reviews|predictions|github|health)(/|$) {
        set $triage_api api:8000;
        proxy_pass http://$triage_api$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
